<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Graded Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf7">
<title>Graded Reader — leitor de inglês por nível</title>
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rd-size:19px;--rd-lh:1.6;--rd-font:var(--serif);
}
body[data-theme=light]{--bg:#fbfaf7;--bg2:#ffffff;--fg:#1f1e1b;--muted:#7a756c;--line:#e7e2d9;--accent:#2f6f62;--accent-fg:#fff;--hl:rgba(255,205,80,.42);--hlw:rgba(255,160,0,.55);--shadow:0 8px 30px rgba(0,0,0,.12)}
body[data-theme=sepia]{--bg:#f4ecd8;--bg2:#faf4e4;--fg:#3b2f22;--muted:#8b7a62;--line:#e0d3b6;--accent:#8a5a2b;--accent-fg:#fff;--hl:rgba(214,150,40,.28);--hlw:rgba(200,120,20,.5);--shadow:0 8px 30px rgba(60,40,10,.15)}
body[data-theme=dark]{--bg:#121212;--bg2:#1c1c1c;--fg:#d9d5cd;--muted:#8d887f;--line:#2d2d2d;--accent:#7fb8a8;--accent-fg:#0d1d19;--hl:rgba(110,150,255,.22);--hlw:rgba(110,150,255,.55);--shadow:0 8px 30px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:default}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none;position:fixed;inset:0}
.view.active{display:block}
#library,#vocab{overflow-y:auto}
.muted{color:var(--muted)} .sm{font-size:12.5px}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45;margin:8px 0}
.wide{width:100%;margin-top:10px}
.link{color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 0}
.link.danger{color:#b4473b;margin-top:14px}
.warnbox{border:1px solid #e0b98a;background:rgba(224,160,80,.12);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin:0 0 16px}
.okline{font-size:12.5px;color:var(--accent);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:10px;line-height:1.4}

/* ---------- Biblioteca ---------- */
.lib{max-width:980px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 60px}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lib-head h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:6px 0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 12px;line-height:1.45}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--line)}
.icon-btn .dot{position:absolute;top:6px;right:5px;font-size:10px;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:0 4px;font-weight:700}
.chips{display:flex;gap:8px;margin:10px 0 20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:14px;font-weight:500;cursor:pointer}
.btn svg.i{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:24px 16px}
.card{text-align:left;display:block}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;background:var(--c);color:#fff;padding:16px 12px 12px 20px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.18),0 12px 26px rgba(0,0,0,.10);overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.1))}
.cover::after{content:"";position:absolute;left:20px;right:12px;top:58%;border-top:1px solid rgba(255,255,255,.35)}
.cover .ct{font-family:var(--serif);font-size:17px;line-height:1.2;font-weight:600;word-break:break-word}
.cover .ca{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.cover.sm{width:72px;flex:none;padding:10px 6px 8px 12px}
.cover.sm .ct{font-size:10.5px}.cover.sm::after{display:none}.cover.sm::before{width:5px}
.card .meta{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--fg)}
.badge.ok{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.thin{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.thin i{display:block;height:100%;background:var(--accent)}
.qbar{position:sticky;bottom:12px;margin-top:24px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center}
.qbar .bar{flex:1}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:51;box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--serif);font-size:21px;margin:4px 0 6px;font-weight:600}
.sec{margin:18px 0}
.lbl{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-size:14px;border-left:1px solid var(--line);line-height:1.15}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.seg button.na{color:var(--muted)}
.seg small{display:block;font-size:10px;opacity:.75}
.range-row{display:flex;align-items:center;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
textarea{min-height:190px;resize:vertical;font-family:var(--serif);line-height:1.5}
.bs-head{display:flex;gap:14px;align-items:flex-start}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.lvl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvl b{font-size:18px}.lvl span{font-size:12px;color:var(--muted);margin-left:4px}
.lvl p{margin:4px 0 0;font-size:12.5px;line-height:1.35}
.lvl .st{font-size:11.5px;color:var(--accent);margin-top:6px;font-weight:700}
.genbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.row.gap{justify-content:flex-start;flex-wrap:wrap;margin-top:10px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.note{font-size:12px;color:var(--muted);min-height:1em}
.note.warn{color:#b4733b;margin-top:8px}
.chq{font-size:13px;color:var(--muted);white-space:nowrap}
.chq .link{padding:2px 0}
.chlist{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.chrow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.chrow:last-child{border-bottom:0}
.chrow .ct{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chrow .cw{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.est{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:10px;font-size:13.5px;line-height:1.5}
.est .em{font-size:14.5px}
.est .ec{margin-top:3px}
.est .ec b{font-size:16px;color:var(--accent)}
.toc-it{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.toc-it.on{color:var(--accent);font-weight:700}
.toc-it small{color:var(--muted);white-space:nowrap;font-weight:400}
.bm-it{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line)}
.bm-it>button:first-child{flex:1;text-align:left;padding:12px 0}
.bm-it .sn{font-family:var(--serif);font-size:14px;color:var(--muted);display:block;margin-top:3px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.ww-demo{font-family:var(--serif);font-size:17px;line-height:2.4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-top:10px}

/* ---------- Palavra ---------- */
.wd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wd-word{font-family:var(--serif);font-size:30px;font-weight:600}
.wd-pos{color:var(--muted);font-style:italic}
.wd-pt{font-size:19px;color:var(--accent);font-weight:700;margin:6px 0 10px}
.wd-def{font-size:16px;line-height:1.45}
.wd-ex{font-family:var(--serif);font-size:15px;margin-top:8px}
.wd-ctx{font-family:var(--serif);color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:14px 0;font-size:14.5px;line-height:1.5}
.skel{height:14px;border-radius:6px;background:var(--line);margin:10px 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.tapmark{position:fixed;background:var(--hlw);opacity:.6;border-radius:3px;pointer-events:none;z-index:45}

/* ---------- Leitor ---------- */
#reader{background:var(--bg);overflow:hidden}
#rv-vp{position:absolute;top:calc(30px + env(safe-area-inset-top));bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;margin:0 auto;max-width:760px;overflow:hidden}
#rv-vp.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
#rv-ct{font-family:var(--rd-font);font-size:var(--rd-size);line-height:var(--rd-lh);color:var(--fg);hyphens:auto;-webkit-hyphens:auto;text-align:justify;overflow-wrap:break-word}
#rv-ct.ww{line-height:calc(var(--rd-lh) * 1em + .55em)}
#rv-vp.paged #rv-ct{position:absolute;top:0;column-fill:auto;transition:transform .2s ease}
#rv-vp.paged #rv-ct.noanim{transition:none}
#rv-vp.scroll #rv-ct{padding-bottom:30vh}
#rv-ct p{margin:0;text-indent:1.3em;orphans:2;widows:2}
#rv-ct .ch-title+p,#rv-ct .pend-note+p{text-indent:0}
.ch-title{font-size:1.3em;font-weight:600;text-align:center;margin:.8em 0 1.4em;line-height:1.25;text-indent:0;break-after:avoid;hyphens:none}
#rv-ct p.pend{color:var(--muted)}
.pend-note{font-family:var(--sans);font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:0 0 1em;text-align:left;line-height:1.4;break-inside:avoid}
.pend-note .btn{margin-top:8px}
/* Word Wise: dica acima da palavra difícil */
ruby{ruby-position:over;ruby-align:center}
rt{font-family:var(--sans);font-size:.5em;line-height:1.15;color:var(--accent);font-weight:500;letter-spacing:0;text-indent:0;white-space:nowrap;hyphens:none;cursor:pointer}
.s.reading{background:var(--hl);border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.w{background:var(--hlw);color:inherit;border-radius:3px}
::highlight(tts-word){background-color:var(--hlw)}
.end{height:1px}
.next-ch{display:flex;margin:2.5em auto 0;font-family:var(--sans)}
#rv-status{position:absolute;left:0;right:0;bottom:0;height:calc(34px + env(safe-area-inset-bottom));padding:0 20px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);max-width:760px;margin:0 auto;gap:12px;cursor:pointer}
#rv-status span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#rv-status span:last-child{white-space:nowrap}
.ribbon{position:absolute;top:0;right:max(22px,calc(50% - 358px));width:14px;height:30px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);display:none;z-index:5}
.ribbon.on{display:block}
.menu-top{position:absolute;top:0;left:0;right:0;padding:env(safe-area-inset-top) 6px 0;height:calc(54px + env(safe-area-inset-top));display:flex;align-items:center;gap:2px;background:var(--bg2);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .2s;z-index:10}
.menu-bot{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s;z-index:10}
.menu-bot>*{max-width:600px;margin-left:auto;margin-right:auto}
#reader.menus .menu-top,#reader.menus .menu-bot{transform:none}
.mt-title{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aa{font-family:var(--serif);font-size:19px;font-weight:600}
.ww-btn{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.02em}
.ww-btn.on{background:var(--accent);color:var(--accent-fg)}
.gen-line{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:10px}
.gen-line:empty{display:none}
.gen-line .bar{flex:1;margin:0}
.mb-info{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:12px auto 6px;gap:10px}
.mb-info span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mb-info span:last-child{white-space:nowrap}
.audio-row{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.play{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:0 6px}
.play svg.i{width:24px;height:24px}
.rate-btn{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin-left:8px;min-width:54px}
.mini{position:absolute;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 8px;box-shadow:var(--shadow);z-index:9}
.mini .play{width:38px;height:38px;margin:0 2px}.mini .play svg.i{width:18px;height:18px}
.mini .icon-btn{width:36px;height:36px}
.mini .rate-btn{margin-left:2px;border:0}
#reader.playing:not(.menus) .mini{display:flex}

/* ---------- Vocabulário ---------- */
.vlist{margin-top:10px}
.vitem{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.vitem .w{font-family:var(--serif);font-size:20px;font-weight:600}
.vitem .w small{font-family:var(--sans);font-size:12px;color:var(--muted);font-style:italic;font-weight:400;margin-left:6px}
.vitem .pt{color:var(--accent);font-weight:700}
.vitem .def{font-size:14px;line-height:1.4}
.vitem .ctx{font-family:var(--serif);font-size:14px;color:var(--muted);line-height:1.45;margin-top:4px}
.vitem .ctx b{color:var(--fg)}
.vitem .src{font-size:11px;color:var(--muted)}
.vitem .acts{grid-row:1/span 4;grid-column:2;display:flex;flex-direction:column}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-theme="light">

<section id="library" class="view active"></section>
<section id="vocab" class="view"></section>

<section id="reader" class="view">
  <div id="rv-vp"><div id="rv-ct" lang="en"></div></div>
  <div class="ribbon" id="rv-ribbon"></div>
  <div id="rv-status" data-act="menus"><span id="st-ch"></span><span id="st-pg"></span></div>

  <div class="mini">
    <button class="play" data-act="play" aria-label="Play/Pause"></button>
    <button class="icon-btn" data-act="snext" aria-label="Próxima frase"></button>
    <button class="rate-btn rate-lbl" data-act="audio"></button>
  </div>

  <div class="menu-top">
    <button class="icon-btn" data-act="back" aria-label="Biblioteca" data-ic="back"></button>
    <div class="mt-title" id="mt-title"></div>
    <button class="icon-btn ww-btn" data-act="ww-toggle" aria-label="Dicas de palavras" title="Dicas de palavras (Word Wise)">Aᵇᶜ</button>
    <button class="icon-btn" data-act="toc" aria-label="Sumário" data-ic="list"></button>
    <button class="icon-btn" data-act="bm" aria-label="Marcador" data-ic="bookmark"></button>
    <button class="icon-btn" data-act="vocab" aria-label="Vocabulário" data-ic="vocab"></button>
    <button class="icon-btn aa" data-act="aa" aria-label="Aparência">Aa</button>
  </div>

  <div class="menu-bot">
    <div id="rv-vers"></div>
    <div class="gen-line" id="rv-gen"></div>
    <div class="mb-info"><span id="mb-ch"></span><span id="mb-pg"></span></div>
    <div class="audio-row">
      <button class="icon-btn" data-act="pprev" aria-label="Parágrafo anterior" data-ic="pprev"></button>
      <button class="icon-btn" data-act="sprev" aria-label="Frase anterior" data-ic="sprev"></button>
      <button class="play" data-act="play" aria-label="Play/Pause"></button>
      <button class="icon-btn" data-act="snext" aria-label="Próxima frase" data-ic="snext"></button>
      <button class="icon-btn" data-act="pnext" aria-label="Próximo parágrafo" data-ic="pnext"></button>
      <button class="rate-btn rate-lbl" data-act="audio" aria-label="Voz e velocidade"></button>
    </div>
  </div>
</section>

<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wc = s => (String(s).match(/\S+/g) || []).length;
const fmtN = n => (n || 0).toLocaleString('pt-BR');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  signal?.addEventListener('abort', () => { clearTimeout(t); rej(new DOMException('Aborted', 'AbortError')); }, { once: true });
});
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* =====================================================================
   Armazenamento permanente
   Ordem de preferência: window.storage (se o ambiente oferecer) → IndexedDB
   do navegador (fica salvo ao fechar o app) → memória (último recurso).
   Não usa localStorage. Gravação imediata após cada bloco adaptado.
   ===================================================================== */
const IDB = {
  p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB indisponível'));
      const r = indexedDB.open('graded-reader', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.p;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), req = fn(t.objectStore('kv'));

    });

  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },

};
const Store = {
  mem: new Map(), _t: {}, warned: false, backend: 'mem', persisted: false,
  async init() {
    if (window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function') { this.backend = 'ws'; return; }
    try { await IDB.open(); this.backend = 'idb'; } catch (e) { console.warn(e); this.backend = 'mem'; }
    try { if (navigator.storage?.persist) this.persisted = await navigator.storage.persist(); } catch (e) {}
  },
  has() { return this.backend !== 'mem'; },
  async get(k) {
    if (this.mem.has(k)) return this.mem.get(k);
    let v = null;
    try {
      if (this.backend === 'idb') { const r = await IDB.get(k); v = r === undefined ? null : r; }
      else if (this.backend === 'ws') { const r = await window.storage.get(k); if (r && r.value != null) v = JSON.parse(r.value); }
    } catch (e) { /* chave inexistente */ }
    if (v != null) this.mem.set(k, v);
    return v;
  },
  async write(k, v) {
    try {
      if (this.backend === 'idb') await IDB.set(k, v);
      else if (this.backend === 'ws') await window.storage.set(k, JSON.stringify(v));
    } catch (e) {
      console.warn('storage', e);
      if (!this.warned) { this.warned = true; toast('Não foi possível gravar no aparelho (espaço cheio?). Exporte um backup em ⚙.', 6000); }
    }
  },
  async set(k, v) { this.mem.set(k, v); clearTimeout(this._t[k]); delete this._t[k]; await this.write(k, v); },
  setLazy(k, v, ms = 800) { this.mem.set(k, v); clearTimeout(this._t[k]); this._t[k] = setTimeout(() => { delete this._t[k]; this.write(k, v); }, ms); },
  flush() { for (const k of Object.keys(this._t)) { clearTimeout(this._t[k]); delete this._t[k]; this.write(k, this.mem.get(k)); } },
  async del(k) {
    this.mem.delete(k); clearTimeout(this._t[k]); delete this._t[k];
    try { if (this.backend === 'idb') await IDB.del(k); else if (this.backend === 'ws') await window.storage.delete(k); } catch (e) {}
  },
  async keys() {
    const ks = new Set(this.mem.keys());
    try { if (this.backend === 'idb') (await IDB.keys()).forEach(k => ks.add(String(k))); } catch (e) {}
    return [...ks];
  },
};

function splitSentences(text) {
  const raw = String(text).match(/[^.!?…]+(?:[.!?…]+|$)(?:["'”’)\]]+)?\s*/g) || [String(text)];
  const merged = [];
  for (const piece of raw) {
    const prev = merged[merged.length - 1];
    if (prev && (/\b(Mr|Mrs|Ms|Dr|St|Sr|Jr|Mt|Prof|Capt|Col|Gen|Rev|Lt|vs|etc|No)\.\s*$/i.test(prev) || /(^|\s)[A-Z]\.\s*$/.test(prev) || !/[A-Za-z0-9]/.test(piece) || /^\s*[a-z,;:—–-]/.test(piece)))
      merged[merged.length - 1] = prev + piece;
    else merged.push(piece);
  }
  const res = [];
  for (let s of merged) {
    s = s.trim();
    while (s.length > 240) { // frases muito longas travam alguns motores de voz
      let cut = -1;
      for (const re of [/[;:]\s/g, /,\s/g, /\s?—\s?/g, /\s/g]) {
        let m, best = -1; re.lastIndex = 0;
        while ((m = re.exec(s))) { const pos = m.index + m[0].length; if (pos > 60 && pos <= 220) best = pos; }
        if (best > 0) { cut = best; break; }
      }
      if (cut < 0) cut = 220;
      res.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
    }
    if (s) res.push(s);
  }
  return res.length ? res : [String(text)];
}

const TOK_RE = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
function stems(w) {
  const o = [w], add = x => { if (x.length > 1) o.push(x); };
  w = w.replace(/(n't|n’t|'s|’s|'re|’re|'ve|’ve|'ll|’ll|'d|’d|'m|’m)$/, ''); add(w);
  if (/ies$/.test(w)) add(w.slice(0, -3) + 'y');
  if (/es$/.test(w)) add(w.slice(0, -2));
  if (/s$/.test(w)) add(w.slice(0, -1));
  for (const suf of ['ed', 'ing', 'er', 'est', 'ly', 'ness', 'ful']) {
    if (!w.endsWith(suf) || w.length <= suf.length + 2) continue;
    const b = w.slice(0, -suf.length); add(b); add(b + 'e');
    if (/([b-df-hj-np-tv-z])\1$/.test(b)) add(b.slice(0, -1));
    if (/i$/.test(b)) add(b.slice(0, -1) + 'y');
  }
  return o;
}
const isEasy = w => w.split(/[-'’]/).every(p => p.length < 3 || stems(p).some(x => EASY.has(x)));

/* Palavras candidatas do capítulo → Map(palavra minúscula → trecho de contexto) */
function wwCandidates(texts) {
  const lowerSeen = new Set(), midCap = new Set(), occ = [];
  for (const p of texts) for (const m of p.matchAll(TOK_RE)) {
    const tk = m[0], l = tk.toLowerCase(), cap = tk[0] !== tk[0].toLowerCase();
    const before = p.slice(Math.max(0, m.index - 3), m.index).trim();
    const sentStart = !before || /[.!?…:"'“‘—–(]$/.test(before);
    if (!cap) lowerSeen.add(l); else if (!sentStart) midCap.add(l);
    occ.push({ l, cap, p, i: m.index, n: tk.length });
  }
  const out = new Map();
  for (const o of occ) {
    if (o.l.length < 3 || out.has(o.l)) continue;
    if (o.cap && !lowerSeen.has(o.l) && midCap.has(o.l)) continue; // nome próprio
    if (isEasy(o.l)) continue;
    const a = Math.max(0, o.p.lastIndexOf(' ', Math.max(0, o.i - 70))), b = o.p.indexOf(' ', Math.min(o.p.length, o.i + o.n + 70));
    out.set(o.l, (a > 0 ? '…' : '') + o.p.slice(a, b < 0 ? undefined : b).trim() + (b > 0 ? '…' : ''));
  }
  return out;
}
const WW_SYS = `You create "Word Wise" hints (like Kindle) for a Brazilian learner reading an English novel.
For each numbered word, read its context and decide its CEFR level IN THAT CONTEXT (A1, A2, B1, B2, C1 or C2).
Reply ONLY with a JSON array, no markdown, no comments.
Include ONLY words at level B1 or above. Omit A1/A2 words, proper names, and invented names of people or places.
Each item: [number, "B1|B2|C1|C2", "hint in very simple English, 1–4 words, fitting the context", "tradução curta em português do Brasil, 1–3 palavras, no contexto"]
Example: [3, "C1", "very dry", "ressecado"]`;

const WW = {
  loading: new Set(), failed: new Set(), noKeyWarned: false,
  async get(key) { if (S.gloss[key]) return S.gloss[key]; const v = await Store.get('gloss:' + key); return S.gloss[key] = v || { words: {} }; },
  missing(g, texts) { const c = wwCandidates(texts); return [...c].filter(([w]) => !(w in g.words)); },
  estimate(n) {
    const mi = modelInfo(S.settings.glossModel), batches = Math.ceil(n / WW_BATCH);
    const tin = (n * 32 + batches * 260) * mi.k, tout = n * 10 * mi.k;   // ~45% das palavras voltam com dica
    return (tin * mi.pin + tout * mi.pout) / 1e6;
  },
  /* Garante as dicas do capítulo aberto (chamado a cada renderização) */
  async ensure() {
    if (!S.settings.ww || !R.meta) return;
    const key = wwKey(R.meta.id, R.version, R.ch);
    if (this.loading.has(key) || this.failed.has(key)) return;
    const g = await this.get(key), miss = this.missing(g, R.paras.map(p => p.t));
    if (!miss.length) return;
    if (API.needsKey()) { if (!this.noKeyWarned) { this.noKeyWarned = true; toast('As dicas de palavras usam a API: configure a chave em ⚙ na biblioteca.', 4500); } return; }
    this.fetch(key, g, miss);
  },
  async fetch(key, g, miss) {
    this.loading.add(key);
    toast(`Gerando dicas de palavras para este capítulo (~${usd(this.estimate(miss.length))})…`, 3000);
    try {
      for (let i = 0; i < miss.length; i += WW_BATCH) {
        const batch = miss.slice(i, i + WW_BATCH);
        const list = batch.map(([w, ctx], j) => `${j + 1}. ${w} — ${ctx}`).join('\n');
        const r = await API.withRetry(() => API.call({ model: S.settings.glossModel, system: WW_SYS, max_tokens: 4000,
          messages: [{ role: 'user', content: `Book: "${R.meta?.title || ''}"\n\n${list}` }] }), { tries: 3 });
        S.wwUsage.cost += usageCost(r.usage, S.settings.glossModel); Store.setLazy('wwusage', S.wwUsage);
        let items = [];
        try { const m = r.text.match(/\[[\s\S]*\]/); items = m ? JSON.parse(m[0]) : []; } catch (e) { console.warn('ww parse', e); }
        batch.forEach(([w]) => { if (!(w in g.words)) g.words[w] = { l: 'A' }; });   // sem dica = palavra fácil
        for (const it of items) {
          if (!Array.isArray(it)) continue;
          const b = batch[(+it[0]) - 1]; if (!b || !WW_ORDER[it[1]]) continue;
          g.words[b[0]] = { l: it[1], en: String(it[2] || '').slice(0, 40), pt: String(it[3] || '').slice(0, 40) };
        }
        await Store.set('gloss:' + key, g);                                        // grava já: não se perde ao fechar
        if (R.meta && wwKey(R.meta.id, R.version, R.ch) === key) { if (Player.playing) R.dirty = true; else relayoutKeep(); }
      }
    } catch (e) {
      console.error(e); this.failed.add(key);
      toast('Não foi possível gerar as dicas: ' + e.message, 5000);
    } finally { this.loading.delete(key); }
  },
};
/* HTML de uma frase, com <ruby> sobre as palavras que têm dica */
function sentHTML(text, gm) {
  if (!gm) return esc(text);
  const min = WW_MIN[S.settings.wwDensity] || 2, pt = S.settings.wwLang === 'pt';
  let out = '', last = 0;
  for (const m of text.matchAll(TOK_RE)) {
    const g = gm[m[0].toLowerCase()];
    if (!g || !(WW_ORDER[g.l] >= min)) continue;
    const hint = pt ? (g.pt || g.en) : (g.en || g.pt); if (!hint) continue;
    out += esc(text.slice(last, m.index)) + `<ruby>${esc(m[0])}<rt>${esc(hint)}</rt></ruby>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

/* =====================================================================

async function exportBackup() {
  saveProgress(); Store.flush();
  const keys = (await Store.keys()).filter(k => k !== 'apikey');
  const data = {};
  for (const k of keys) { const v = await Store.get(k); if (v != null) data[k] = v; }
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `graded-reader-backup-${stamp}.json`;
  const blob = new Blob([JSON.stringify({ app: 'graded-reader', v: 1, date: new Date().toISOString(), data })], { type: 'application/json' });
  S.settings.lastBackup = Date.now(); saveSettings();
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('Backup pronto — salve em Arquivos/iCloud.'); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup exportado: ' + name, 4000);
}
async function importBackup(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'graded-reader' || !j.data) throw new Error('o arquivo não é um backup deste app');
    if (!confirm(`Importar o backup de ${new Date(j.date).toLocaleString('pt-BR')}?\nLivros e versões do backup serão adicionados/atualizados neste aparelho.`)) return;
    for (const [k, v] of Object.entries(j.data)) {
      if (k === 'library') { const cur = await Store.get('library') || []; const ids = new Set(v.map(m => m.id)); await Store.set('library', [...v, ...cur.filter(m => !ids.has(m.id) && !(m.sample && v.some(x => x.title === m.title)))]); }
      else if (k === 'vocab') { const cur = await Store.get('vocab') || []; const ks = new Set(v.map(x => x.key)); await Store.set('vocab', [...v, ...cur.filter(x => !ks.has(x.key))]); }
      else if (k === 'progress' || k === 'bookmarks') await Store.set(k, { ...(await Store.get(k) || {}), ...v });
      else if (k === 'settings') await Store.set(k, { ...(await Store.get(k) || {}), ...v, rememberKey: S.settings.rememberKey });
      else await Store.set(k, v);
    }
    toast('Backup importado ✓ Recarregando…'); setTimeout(() => location.reload(), 900);
  } catch (err) { toast('Falha ao importar: ' + err.message, 5000); }
}

async function getBook(id) { if (S.books[id]) return S.books[id]; const b = await Store.get('book:' + id); if (b) S.books[id] = b; return b; }
async function getAdapt(id, l) { const k = id + ':' + l; if (S.adapt[k]) return S.adapt[k]; const v = await Store.get('adapt:' + k); if (v) S.adapt[k] = v; return v || null; }

async function addBook(b, opts = {}) {
  normalizeBook(b);
  const id = uid(); b.id = id;
  const words = b.chapters.reduce((a, c) => a + c.paras.reduce((x, p) => x + wc(p), 0), 0);
  const meta = { id, title: b.title || 'Sem título', author: b.author || '', color: colorFor(b.title), words, chapters: b.chapters.length, added: Date.now(), levels: {}, sample: !!opts.sample };
  S.books[id] = b; S.library.unshift(meta);
  await Store.set('book:' + id, b); await Store.set('library', S.library);
  if (!opts.silent) renderLibrary();
  return meta;
}
async function deleteBook(id) {
  Queue.jobs = Queue.jobs.filter(j => j.bookId !== id);
  S.library = S.library.filter(m => m.id !== id); delete S.books[id]; delete S.progress[id]; delete S.bookmarks[id];
  await Store.del('book:' + id); for (const l of LV) { delete S.adapt[id + ':' + l]; await Store.del('adapt:' + id + ':' + l); }
  for (const k of await Store.keys()) if (k.startsWith('gloss:' + id + ':')) { delete S.gloss[k.slice(6)]; await Store.del(k); }
  await Store.set('library', S.library); Store.setLazy('progress', S.progress); Store.setLazy('bookmarks', S.bookmarks);
  closeSheet(); renderLibrary(); toast('Livro removido');
}

async function onFile(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('Importando…');
    const book = /\.epub$/i.test(f.name) ? await parseEpub(await f.arrayBuffer(), f.name.replace(/\.epub$/i, ''))
      : parseTxt(await f.text(), f.name.replace(/\.[^.]+$/, ''));
    const meta = await addBook(book);
    toast(`“${meta.title}” importado · ${meta.chapters} capítulo(s)`);
    openBookSheet(meta.id);
  } catch (err) { console.error(err); toast('Não foi possível importar: ' + err.message, 5000); }
}

/* =====================================================================
   API Anthropic com nova tentativa
   ===================================================================== */
const API = {
  needsKey() { return /api\.anthropic\.com/i.test(S.settings.endpoint) && !S.settings.apiKey; },
  async call({ system, messages, max_tokens = 2048, signal, model }) {
    const s = S.settings;
    if (this.needsKey()) { const err = new Error('chave da API não configurada'); err.noKey = true; throw err; }
    // O cabeçalho de acesso direto é obrigatório para chamadas feitas pelo navegador (CORS)
    const headers = { 'content-type': 'application/json', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
    if (s.apiKey) headers['x-api-key'] = s.apiKey;
    let res;
    try { res = await fetch(s.endpoint, { method: 'POST', headers, body: JSON.stringify({ model: model || s.model, max_tokens, system, messages }), signal }); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      const err = new Error(navigator.onLine === false ? 'sem conexão com a internet' : 'falha de rede ao acessar a API (verifique internet, endpoint ou bloqueio do navegador/rede corporativa)');
      err.retry = true; throw err;
    }
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch (e) {}
      const err = new Error(`API ${res.status}${msg ? ': ' + msg : ''}${res.status === 401 ? ' — chave inválida; confira em ⚙' : ''}`); err.status = res.status; throw err;
    }
    const data = await res.json();
    return { text: (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim(), stop: data.stop_reason, usage: data.usage };
  },
  async withRetry(fn, { tries = 4, onRetry, signal } = {}) {
    let last;
    for (let i = 0; i < tries; i++) {
      try { return await fn(i); }
      catch (e) {
        last = e;
        if (e.name === 'AbortError' || e.noKey || signal?.aborted) throw e;
        const retryable = e.retry || !e.status || [408, 409, 429].includes(e.status) || e.status >= 500;
        if (!retryable || i === tries - 1) throw e;
        const wait = Math.min(30000, 2000 * 2 ** i) + Math.random() * 600;
        onRetry?.(e, i + 1, wait);
        await sleep(wait, signal);
      }
    }
    throw last;
  },
};

/* =====================================================================
   Adaptação — REGRA CENTRAL aplicada no prompt e verificada no código
   ===================================================================== */
function systemPrompt(level) {
  return `You are an expert author of graded readers for learners of English. You rewrite literary text so that a learner at a given CEFR level can read it.

INVIOLABLE RULE — FAITHFUL ADAPTATION, NOT A SUMMARY:
- NEVER summarize, shorten, cut, skip, reorder, add to, or change the story in any way.
- Keep EVERY event, action, description that matters, character, and line of dialogue, in the ORIGINAL ORDER, with the original tone and point of view.
- Every sentence of the original must be represented in your version, in the same order. You may split one long sentence into several short ones; you may never drop content.
- Dialogue stays dialogue (in quotation marks), spoken by the same characters.
- Keep names of people and places and other essential story terms exactly as in the original.
- Your version must have a SIMILAR LENGTH to the original (about 85%–130% of its word count). Simpler language usually needs the same number of words or more, not fewer.
- Keep the SAME number of paragraphs, in the same order, separated by one blank line. Paragraph N of your text corresponds to paragraph N of the original.
- Only the language changes: vocabulary, sentence length and verb tenses suitable for the level.

TARGET LANGUAGE LEVEL:
${LEVELS[level].prompt}

OUTPUT FORMAT: Output ONLY the adapted text. No title, no introduction, no notes, no comments, no explanations, no markdown, no XML tags.`;
}
function userPrompt({ book, chTitle, level, src, n, w, prev, feedback }) {
  return `BOOK: "${book.title}"${book.author ? ' by ' + book.author : ''}
CHAPTER: "${chTitle}"
TARGET LEVEL: CEFR ${level}
${prev ? `
END OF THE PREVIOUS ADAPTED PASSAGE (context only, do NOT repeat or rewrite it; continue with the same style, names and terms):
<previous>
${prev}
</previous>
` : ''}
ORIGINAL PASSAGE TO ADAPT (${n} paragraph${n > 1 ? 's' : ''}, ${w} words):
<original>
${src}
</original>

Rewrite the passage at CEFR ${level}. Output exactly ${n} paragraph${n > 1 ? 's' : ''} separated by blank lines and about ${w} words (at least ${Math.round(w * 0.85)}). Keep every event, detail, character and line of dialogue, in the same order.${feedback ? `

YOUR PREVIOUS ATTEMPT WAS REJECTED because: ${feedback}. Fix this and follow every rule strictly.` : ''}`;
}
function cleanOutput(t) {
  t = String(t).replace(/\r/g, '').replace(/^```[a-z]*\n?|```$/gim, '').replace(/<\/?(original|previous|adapted|text)>/gi, '').trim();
  t = t.replace(/^(here is|here's|sure|certainly|below is)[^\n]*:\s*\n+/i, '');
  t = t.replace(/\n+\s*\(?note:[^\n]*$/i, '');
  return t.replace(/\n{3,}/g, '\n\n').trim();
}
const parasOf = t => t.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
function validateAdaptation(src, out, n, stop) {
  const a = wc(src), b = wc(out), issues = [];
  if (!b) return ['the answer was empty'];
  if (stop === 'max_tokens') issues.push('the answer was cut off before the end');
  if (a >= 40 && b / a < 0.75) issues.push(`it is too short (${b} words vs ${a} in the original) — content was summarized or cut`);
  if (a >= 40 && b / a > 1.9) issues.push(`it is too long (${b} words vs ${a}) — content may have been added`);
  const p = parasOf(out).length; if (p !== n) issues.push(`it has ${p} paragraphs but the original has ${n}`);
  return issues;
}
function fixParaCount(out, n) {
  const ps = parasOf(out);
  if (ps.length > n && n > 0) { const head = ps.slice(0, n - 1); head.push(ps.slice(n - 1).join(' ')); return head.join('\n\n'); }
  return ps.join('\n\n');
}
const lastWords = (t, n) => { const w = t.split(/\s+/); return (w.length > n ? '… ' : '') + w.slice(-n).join(' '); };

function makeBlocks(book) {
  const blocks = [];
  book.chapters.forEach((c, ci) => {
    let start = 0, w = 0;
    c.paras.forEach((p, pi) => {
      w += wc(p);
      if (w >= 450 || pi === c.paras.length - 1) { blocks.push({ ch: ci, p0: start, p1: pi, out: null, warn: '' }); start = pi + 1; w = 0; }
    });
  });
  return blocks;
}
const doneCount = ad => ad.blocks.filter(b => b.out != null).length;
function chProgress(ad, ci) {
  if (!ad) return { d: 0, t: 0 };
  const bs = ad.blocks.filter(b => b.ch === ci);
  return { d: bs.filter(b => b.out != null).length, t: bs.length };
}

async function ensureAdapt(bookId, level) {
  let ad = await getAdapt(bookId, level);
  if (!ad) {
    const book = await getBook(bookId);
    ad = { key: bookId + ':' + level, bookId, level, blocks: makeBlocks(book), created: Date.now(), usage: { in: 0, out: 0, cost: 0 } };
    S.adapt[ad.key] = ad; await saveAdapt(ad);
  }
  return ad;
}
async function saveAdapt(ad) {
  await Store.set('adapt:' + ad.key, ad);
  const m = metaOf(ad.bookId); if (m) { m.levels = m.levels || {}; m.levels[ad.level] = { done: doneCount(ad), total: ad.blocks.length }; await Store.set('library', S.library); }
}

async function adaptBlock(book, ad, i, signal) {
  const b = ad.blocks[i], c = book.chapters[b.ch];
  const paras = c.paras.slice(b.p0, b.p1 + 1), src = paras.join('\n\n'), n = paras.length, w = wc(src);
  const prevB = ad.blocks[i - 1]; const prev = prevB?.out ? lastWords(prevB.out, 110) : '';
  let feedback = '', best = null, maxTok = clamp(Math.ceil(w * 3) + 600, 1200, 8000);
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await API.withRetry(() => API.call({ system: systemPrompt(ad.level), max_tokens: maxTok, signal,
      messages: [{ role: 'user', content: userPrompt({ book, chTitle: c.title, level: ad.level, src, n, w, prev, feedback }) }] }),
      { signal, onRetry: (e, k, ms) => Queue.setNote(`Erro (${e.message}). Nova tentativa ${k} em ${Math.round(ms / 1000)} s…`) });
    addUsage(ad, r.usage);
    const out = cleanOutput(r.text);
    const issues = validateAdaptation(src, out, n, r.stop);
    if (!issues.length) { b.out = out; b.warn = ''; Queue.setNote(''); return; }
    if (!best || issues.length < best.issues.length) best = { out, issues };
    feedback = issues.join('; ');
    if (r.stop === 'max_tokens') maxTok = Math.min(8000, maxTok * 2);
    Queue.setNote(`Bloco ${i + 1}: verificação recusou (${issues[0]}). Refazendo…`);
  }
  b.out = fixParaCount(best.out, n); b.warn = best.issues.join('; ');
}

/* Fila de geração por capítulos selecionados, com pausar/retomar */
function jobProgress(job, ad) {
  const bs = ad.blocks.filter(b => job.chs.has(b.ch));
  return { d: bs.filter(b => b.out != null).length, t: bs.length || 1 };
}
const Queue = {
  jobs: [], running: false, paused: false, ctrl: null, note: '',
  job(key) { return this.jobs.find(j => j.key === key); },
  status(key) { if (!this.job(key)) return 'idle'; if (this.paused) return 'paused'; return this.jobs[0].key === key ? 'running' : 'queued'; },
  async add(bookId, level, chs) {
    if (API.needsKey()) { openSettings('Para gerar a versão adaptada, informe sua chave da API Anthropic (platform.claude.com → API Keys).'); return; }
    if (!chs || !chs.size) { toast('Selecione ao menos um capítulo.'); return; }
    const ad = await ensureAdapt(bookId, level);
    if (!ad.blocks.some(b => chs.has(b.ch) && b.out == null)) { toast('Os capítulos selecionados já estão adaptados.'); return; }
    const j = this.job(ad.key);
    if (j) chs.forEach(c => j.chs.add(c)); else this.jobs.push({ key: ad.key, bookId, level, chs: new Set(chs) });
    this.paused = false; refreshAll(); this.run();
  },
  pause() { this.paused = true; this.ctrl?.abort(); this.note = ''; refreshAll(); },
  resume() { if (API.needsKey()) { openSettings('Informe a chave da API para retomar a geração.'); return; } this.paused = false; refreshAll(); this.run(); },
  setNote(t) { this.note = t; $$('.gen-note').forEach(e => e.textContent = t); },
  async run() {
    if (this.running) return; this.running = true;
    while (this.jobs.length && !this.paused) {
      const job = this.jobs[0];
      const ad = await getAdapt(job.bookId, job.level), book = await getBook(job.bookId);
      if (!ad || !book) { this.jobs.shift(); continue; }
      const i = ad.blocks.findIndex(b => b.out == null && job.chs.has(b.ch));
      if (i < 0) {
        this.jobs.shift(); await saveAdapt(ad);
        toast(`Capítulos selecionados (${job.level}) concluídos e salvos ✓ · gasto real ${usd(ad.usage?.cost)}`, 4500);
        refreshAll(); continue;
      }
      this.ctrl = new AbortController();
      try { await adaptBlock(book, ad, i, this.ctrl.signal); await saveAdapt(ad); onBlockDone(ad, i); }
      catch (e) {
        if (e.noKey) { this.paused = true; this.setNote(''); openSettings('Informe a chave da API para continuar.'); }
        else if (e.name !== 'AbortError') { console.error(e); this.paused = true; this.setNote('Falhou: ' + e.message); toast('Adaptação pausada: ' + e.message, 6000); }
      }
      refreshAll();
    }
    this.running = false; this.ctrl = null; refreshAll();
  },
};
function onBlockDone(ad, i) {
  if (S.ui.view !== 'reader' || !R.meta || R.meta.id !== ad.bookId || R.version !== ad.level) return;
  R.adapt = ad;
  if (ad.blocks[i].ch === R.ch) { if (Player.playing) R.dirty = true; else renderChapter(R.ch, { para: anchorPara(), keepAudio: true }); }
}
const refreshAll = debounce(() => {
  if (S.ui.view === 'library') renderLibrary();
  if (S.ui.sheet === 'book') refreshBookSheet();
  if (S.ui.view === 'reader' && R.meta) { renderVersions(); renderGenLine(); }
}, 60);

let sheetClose = null;
function openSheet(html, kind = '', onClose = null) {
  if (sheetClose) { const f = sheetClose; sheetClose = null; f(); }
  $('#sheet-body').innerHTML = html; $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('on'); $('#backdrop').classList.add('on');
  S.ui.sheet = kind; sheetClose = onClose;
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#backdrop').classList.remove('on'); S.ui.sheet = '';
  if (sheetClose) { const f = sheetClose; sheetClose = null; f(); }
}

/* Seleção de capítulos */
function quickSel(q, book, ad) {
  const all = book.chapters.map((_, i) => i);
  const pend = all.filter(i => { const p = chProgress(ad, i); return !p.t || p.d < p.t; });
  if (q === 'none') return [];
  if (q === 'all') return pend.length ? pend : all;
  return pend.slice(0, 5); // próximos 5 ainda não adaptados
}
function getSel(id, lvl) {
  const k = id + ':' + lvl;
  if (!S.ui.sel[k]) { const book = S.books[id]; S.ui.sel[k] = new Set(book ? quickSel('next5', book, S.adapt[k]) : []); }
  return S.ui.sel[k];
}
function estHTML(id, lvl) {
  const book = S.books[id]; if (!book) return '';
  const ad = S.adapt[id + ':' + lvl], sel = getSel(id, lvl);
  if (!sel.size) return `<div class="muted">Selecione ao menos um capítulo para ver a estimativa.</div>
    <button class="btn primary wide" disabled>Adaptar selecionados (${lvl})</button>`;
  const e = estimate(book, ad, lvl, sel);
  return `<div class="em"><b>${e.n} capítulo${e.n > 1 ? 's' : ''}</b> · ${e.pagesOrig} página${e.pagesOrig > 1 ? 's' : ''} originais → ~${e.pagesAd} página${e.pagesAd > 1 ? 's' : ''} em inglês ${lvl}</div>
    <div class="ec">${e.pending ? `Custo estimado: <b>${usd(e.cost)}</b> <span class="muted">· ${esc(e.model)} · ${e.pending} bloco${e.pending > 1 ? 's' : ''}${e.done ? ` (${e.done} já prontos, sem custo)` : ''}</span>`
      : '<span class="muted">Todos os capítulos selecionados já estão adaptados.</span>'}</div>
    <button class="btn primary wide" data-act="gen" data-l="${lvl}" ${e.pending ? '' : 'disabled'}>Adaptar selecionados (${lvl})</button>`;
}
function updateEstimate() { const el = $('#est'); if (el && S.ui.sheetBook) el.innerHTML = estHTML(S.ui.sheetBook, S.ui.selLevel); }

/* Livro: níveis, capítulos e geração */
async function openBookSheet(id, level) {
  S.ui.sheetBook = id; S.ui.selLevel = level || S.ui.selLevel || S.settings.level;
  await getBook(id);
  for (const l of LV) await getAdapt(id, l);
  openSheet(await bookSheetHTML(id), 'book', () => { S.ui.sheetBook = null; });
}
async function refreshBookSheet() {
  if (S.ui.sheet !== 'book' || !S.ui.sheetBook) return;
  const st = $('#sheet').scrollTop, cl = $('.chlist')?.scrollTop || 0;
  $('#sheet-body').innerHTML = await bookSheetHTML(S.ui.sheetBook);
  $('#sheet').scrollTop = st; const l = $('.chlist'); if (l) l.scrollTop = cl;
}
async function bookSheetHTML(id) {
  const m = metaOf(id), book = await getBook(id); if (!m || !book) return '';
  const lvl = S.ui.selLevel, ads = {};
  for (const l of LV) ads[l] = await getAdapt(id, l);
  const cards = LV.map(l => {
    const ad = ads[l]; let st = '';
    if (ad && doneCount(ad)) { const d = doneCount(ad), t = ad.blocks.length; const qs = Queue.status(ad.key);
      st = d === t ? 'Pronta ✓' : `${Math.round(100 * d / t)}% do livro${qs === 'running' ? ' · gerando' : qs === 'queued' ? ' · na fila' : qs === 'paused' ? ' · pausada' : ''}`; }
    return `<button class="lvl ${l === lvl ? 'on' : ''}" data-act="sel-level" data-l="${l}"><b>${l}</b><span>${LEVELS[l].name}</span><p>${LEVELS[l].desc}</p>${st ? `<div class="st">${st}</div>` : ''}</button>`;
  }).join('');

  const ad = ads[lvl], sel = getSel(id, lvl);
  const rows = book.chapters.map((c, i) => {
    const p = chProgress(ad, i);
    const badge = p.t && p.d === p.t ? '<span class="badge ok">✓</span>' : p.d ? `<span class="badge">${Math.round(100 * p.d / p.t)}%</span>` : '';
    return `<label class="chrow"><input type="checkbox" data-ch="${i}" ${sel.has(i) ? 'checked' : ''}><span class="ct">${i + 1}. ${esc(shortTitle(c.title))}</span><span class="cw">${fmtN(chWords(book, i))} pal. ${badge}</span></label>`;
  }).join('');

  let progress = '';
  if (ad && (doneCount(ad) || Queue.job(ad.key))) {
    const d = doneCount(ad), t = ad.blocks.length, qs = Queue.status(ad.key), job = Queue.job(ad.key), warn = ad.blocks.filter(b => b.warn).length;
    const jp = job ? jobProgress(job, ad) : null;
    progress = `<div class="genbox">
      <div class="row"><span>${job ? `${qs === 'paused' ? 'Pausado' : qs === 'queued' ? 'Na fila' : 'Adaptando'}: ${jp.d} de ${jp.t} blocos selecionados` : `Versão ${lvl}: ${d} de ${t} blocos do livro`}</span><b>${Math.round(100 * (job ? jp.d / jp.t : d / t))}%</b></div>

/* =====================================================================
   Leitor
   ===================================================================== */
const vp = () => $('#rv-vp'), ct = () => $('#rv-ct');

async function loadGloss(id, v, n) {
  for (let i = 0; i < n; i++) { const k = wwKey(id, v, i); if (!S.gloss[k]) { const g = await Store.get('gloss:' + k); if (g) S.gloss[k] = g; } }
}
async function openReader(id, version) {
  const book = await getBook(id), meta = metaOf(id); if (!book || !meta) return;
  if (R.meta && R.meta.id !== id) Player.stop();
  R.book = book; R.meta = meta;
  R.cw = book.chapters.map(c => c.paras.reduce((a, p) => a + wc(p), 0));
  R.cum = R.cw.reduce((a, w, i) => (a.push(i ? a[i - 1] + R.cw[i - 1] : 0), a), []);
  const prog = S.progress[id] || {};
  let v = version || prog.version || 'orig', paraRatio = null;
  R.adapt = v === 'orig' ? null : await getAdapt(id, v);
  if (v !== 'orig' && !R.adapt) v = 'orig';
  const ch = prog.ch || 0, para = prog.para || 0;
  if (prog.version && prog.version !== v) { const old = R.version; R.version = prog.version; const oldAd = R.adapt;
    R.adapt = prog.version === 'orig' ? null : await getAdapt(id, prog.version); const n = buildParas(ch).length; paraRatio = n ? para / n : 0; R.adapt = oldAd; R.version = old; }
  R.version = v;
  if (prog.audio && prog.audio.version === v) { Player.ch = prog.audio.ch; Player.idx = prog.audio.idx; } else { Player.ch = -1; Player.idx = 0; }
  showView('reader'); $('#mt-title').textContent = meta.title;
  applySettings(false);
  await loadGloss(id, v, book.chapters.length);              // dicas já pagas (sem custo)
  renderChapter(clamp(ch, 0, book.chapters.length - 1), paraRatio != null ? { paraRatio } : { para });
  if (!S.settings.hinted) { S.settings.hinted = true; saveSettings(); setTimeout(() => toast('Bordas: virar página · Centro (fora de palavras, topo ou rodapé): menu · Palavra: tradução · Aᵇᶜ: dicas de palavras.', 5500), 400); }
}
function closeReader() { Player.stop(); saveProgress(); Store.flush(); closeSheet(); R.meta = null; showView('library'); }

function buildParas(ch) {
  const c = R.book.chapters[ch];
  if (R.version === 'orig' || !R.adapt) return c.paras.map(t => ({ t, pend: false }));
  const out = [];
  for (const b of R.adapt.blocks) {
    if (b.ch !== ch) continue;
    if (b.out != null) parasOf(b.out).forEach(t => out.push({ t, pend: false }));
    else for (let i = b.p0; i <= b.p1; i++) out.push({ t: c.paras[i], pend: true });
  }
  return out;
}
function chapterQueued() { const j = R.adapt && Queue.job(R.adapt.key); return !!(j && j.chs.has(R.ch)); }
function pendNoteHTML() {
  if (chapterQueued()) return `<div class="pend-note">Capítulo em adaptação para ${R.version}. Os trechos em cinza estão no original e serão trocados automaticamente.</div>`;
  const e = estimate(R.book, R.adapt, R.version, new Set([R.ch]));
  return `<div class="pend-note">Este capítulo ainda não foi adaptado para ${R.version}; os trechos em cinza estão no original.<br>
    <button class="btn sm" data-act="gen-ch">Adaptar este capítulo · ~${usd(e.cost)}</button></div>`;
}

function renderChapter(ch, o = {}) {
  if (!o.fromPlayer && !o.keepAudio && Player.playing && ch !== R.ch) Player.pause();
  R.ch = ch; R.paras = buildParas(ch); R.sent = []; R.dirty = false;
  const c = R.book.chapters[ch];
  const gm = S.settings.ww ? S.gloss[wwKey(R.meta.id, R.version, ch)]?.words : null;
  ct().classList.toggle('ww', !!S.settings.ww);
  let h = `<h2 class="ch-title">${esc(c.title)}</h2>`;
  if (R.paras.some(p => p.pend)) h += pendNoteHTML();
  R.paras.forEach((p, pi) => {
    h += `<p data-p="${pi}"${p.pend ? ' class="pend"' : ''}>` + splitSentences(p.t).map(s => {
      const i = R.sent.length, html = sentHTML(s, gm); R.sent.push({ p: pi, text: s, html });
      return `<span class="s" data-s="${i}">${html}</span>`;
    }).join(' ') + '</p>';
  });
  if (S.settings.mode === 'scroll' && ch < R.book.chapters.length - 1) h += `<button class="btn next-ch" data-act="next-ch">Próximo capítulo →</button>`;
  h += '<div class="end"></div>';
  ct().innerHTML = h;
  const els = $$('.s', ct()); R.sent.forEach((s, i) => s.el = els[i]);
  layout();
  if (o.paraRatio != null) o.para = Math.min(R.paras.length - 1, Math.floor(o.paraRatio * R.paras.length));
  if (o.atEnd) { if (S.settings.mode === 'paged') goPage(R.pages - 1, true); else vp().scrollTop = vp().scrollHeight; }
  else if (o.para > 0) goToPara(o.para);
  else { if (S.settings.mode === 'paged') goPage(0, true); else vp().scrollTop = 0; }
  if (Player.playing && Player.ch === R.ch && R.sent[Player.idx]) R.sent[Player.idx].el.classList.add('reading');
  $$('.ww-btn').forEach(b => b.classList.toggle('on', !!S.settings.ww));
  renderVersions(); renderGenLine(); updateStatus(); saveProgress();
  WW.ensure();
}

function layout() {
  const v = vp(), c = ct(), m = MARGINS[S.settings.margin] || 28;
  if (S.settings.mode === 'paged') {
    v.classList.add('paged'); v.classList.remove('scroll'); v.scrollTop = 0;
    const W = v.clientWidth, H = v.clientHeight; R.W = W;
    c.style.cssText = `left:${m}px;width:${W - 2 * m}px;height:${H}px;column-width:${W - 2 * m}px;column-gap:${2 * m}px;transform:translateX(${-R.page * W}px)`;
    const end = c.querySelector('.end');
    R.pages = end ? Math.max(1, Math.floor((end.getBoundingClientRect().left - c.getBoundingClientRect().left + 2) / W) + 1) : 1;
  } else {
    v.classList.add('scroll'); v.classList.remove('paged');
    c.style.cssText = `padding:0 ${m}px;`; R.pages = 1; R.page = 0;
  }
}
function goPage(n, instant) {
  R.page = clamp(n, 0, R.pages - 1);
  const c = ct();
  if (instant) { c.classList.add('noanim'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('noanim'))); }
  c.style.transform = `translateX(${-R.page * R.W}px)`;
  updateStatus(); saveProgress();
}
const pageOfRect = r => Math.floor((r.left - ct().getBoundingClientRect().left + 2) / R.W);
function pageOf(el) { const rs = el.getClientRects(); return rs.length ? pageOfRect(rs[0]) : R.page; }
function goToPara(pi) {
  const el = ct().querySelector(`[data-p="${pi}"]`); if (!el) return;
  if (S.settings.mode === 'paged') goPage(pageOf(el), true); else vp().scrollTop = el.offsetTop - 8;
}
function anchorPara() {
  const ps = $$('p[data-p]', ct());
  if (S.settings.mode === 'paged') {
    for (const p of ps) { const rs = p.getClientRects(); if (rs.length && pageOfRect(rs[rs.length - 1]) >= R.page) return +p.dataset.p; }
  } else {
    const top = vp().scrollTop; for (const p of ps) if (p.offsetTop + p.offsetHeight > top + 4) return +p.dataset.p;
  }
  return 0;
}
function chapterFrac() {
  if (S.settings.mode === 'paged') return (R.page + 1) / R.pages;
  const v = vp(), max = v.scrollHeight - v.clientHeight; return max > 0 ? clamp(v.scrollTop / max, 0, 1) : 1;
}
function pct() { const tot = R.meta.words || 1; return clamp((R.cum[R.ch] + chapterFrac() * R.cw[R.ch]) / tot, 0, 1); }
function updateStatus() {
  if (!R.book) return;
  const t = R.book.chapters[R.ch].title, p = Math.round(pct() * 100);
  const pg = S.settings.mode === 'paged' ? `Pág. ${R.page + 1} de ${R.pages} · ` : '';
  $('#st-ch').textContent = t; $('#st-pg').textContent = pg + p + '%';
  $('#mb-ch').textContent = `Cap. ${R.ch + 1}/${R.book.chapters.length} · ${t}`; $('#mb-pg').textContent = p + '% do livro';
  $('#rv-ribbon').classList.toggle('on', pageBookmarks().length > 0);
}
function nextPage() {
  if (S.settings.mode === 'scroll') {
    const v = vp(); if (v.scrollTop + v.clientHeight >= v.scrollHeight - 4) { if (R.ch < R.book.chapters.length - 1) renderChapter(R.ch + 1); }
    else v.scrollBy({ top: v.clientHeight * 0.9, behavior: 'smooth' }); return;
  }
  if (R.page < R.pages - 1) goPage(R.page + 1); else if (R.ch < R.book.chapters.length - 1) renderChapter(R.ch + 1); else toast('Fim do livro');
}
function prevPage() {
  if (S.settings.mode === 'scroll') {
    const v = vp(); if (v.scrollTop <= 2) { if (R.ch > 0) renderChapter(R.ch - 1, { atEnd: true }); }
    else v.scrollBy({ top: -v.clientHeight * 0.9, behavior: 'smooth' }); return;
  }
  if (R.page > 0) goPage(R.page - 1); else if (R.ch > 0) renderChapter(R.ch - 1, { atEnd: true });
}
function saveProgress() {
  if (!R.meta || !R.book) return;
  S.progress[R.meta.id] = { version: R.version, ch: R.ch, para: anchorPara(), pct: pct(),
    audio: Player.ch >= 0 ? { ch: Player.ch, idx: Player.idx, version: R.version } : null, t: Date.now() };
  Store.setLazy('progress', S.progress);
}
function relayoutKeep() { if (S.ui.view !== 'reader' || !R.book) return; renderChapter(R.ch, { para: anchorPara(), keepAudio: true }); }

function renderVersions() {
  if (!R.meta) return;
  const m = R.meta;
  $('#rv-vers').innerHTML = `<div class="seg">` + ['orig', ...LV].map(v => {
    const s = m.levels?.[v]; const avail = v === 'orig' || (s && s.done > 0);
    return `<button class="${v === R.version ? 'on' : ''} ${avail ? '' : 'na'}" data-act="ver" data-v="${v}">${v === 'orig' ? 'Original' : v}${v !== 'orig' && s && s.done && s.done < s.total ? `<small>${Math.round(100 * s.done / s.total)}%</small>` : (v !== 'orig' && !(s && s.done) ? '<small>gerar</small>' : '')}</button>`;
  }).join('') + `</div>`;
}
function renderGenLine() {
  const el = $('#rv-gen'); if (!R.meta || R.version === 'orig' || !R.adapt) { el.innerHTML = ''; return; }
  const ad = R.adapt, job = Queue.job(ad.key);
  if (job) {
    const qs = Queue.status(ad.key), jp = jobProgress(job, ad);
    el.innerHTML = `<span>${qs === 'running' ? 'Adaptando' : qs === 'queued' ? 'Na fila' : 'Pausado'} ${jp.d}/${jp.t}</span><div class="bar"><i style="width:${100 * jp.d / jp.t}%"></i></div>
      <button class="btn sm" data-act="${qs === 'paused' ? 'resume' : 'pause'}">${qs === 'paused' ? 'Retomar' : 'Pausar'}</button>`;
    return;
  }
  const p = chProgress(ad, R.ch);
  el.innerHTML = p.d < p.t ? `<span>Capítulo não adaptado</span><div class="bar"><i style="width:${100 * p.d / p.t}%"></i></div><button class="btn sm" data-act="gen-ch">Adaptar capítulo</button>` : '';
}
async function setVersion(v) {
  if (v === R.version) return;
  if (v !== 'orig') {
    const ad = await getAdapt(R.meta.id, v);
    if (!ad || doneCount(ad) === 0) { hideMenus(); openBookSheet(R.meta.id, v); return; }
    R.adapt = ad;
  } else R.adapt = null;
  Player.stop(); Player.ch = -1;
  const ratio = R.paras.length ? anchorPara() / R.paras.length : 0;
  await loadGloss(R.meta.id, v, R.book.chapters.length);
  R.version = v; renderChapter(R.ch, { paraRatio: ratio });
  toast(v === 'orig' ? 'Texto original' : `Versão adaptada ${v}`);
}
function showMenus() { $('#reader').classList.add('menus'); }
function hideMenus() { $('#reader').classList.remove('menus'); }
function toggleMenus() { $('#reader').classList.toggle('menus'); }

/* Sumário e marcadores */
function openToc(tab) { S.ui.tocTab = tab || S.ui.tocTab || 'toc'; openSheet(tocHTML(), 'toc'); const on = $('.toc-it.on'); if (on) on.scrollIntoView({ block: 'center' }); }
function tocHTML() {
  const tab = S.ui.tocTab;
  let body = '';
  if (tab === 'toc') {
    body = R.book.chapters.map((c, i) => {
      let st = Math.round(100 * R.cum[i] / (R.meta.words || 1)) + '%';
      if (R.adapt) { const p = chProgress(R.adapt, i); st = (p.d === p.t ? '✓ ' : p.d ? '◐ ' : '○ ') + st; }
      return `<button class="toc-it ${i === R.ch ? 'on' : ''}" data-act="goto-ch" data-i="${i}"><span>${esc(c.title)}</span><small>${st}</small></button>`;
    }).join('');
  } else {
    const list = S.bookmarks[R.meta.id] || [];
    body = list.length ? list.map(b => `<div class="bm-it"><button data-act="goto-bm" data-id="${b.id}"><b>${esc(R.book.chapters[b.ch]?.title || '')}</b> <span class="muted sm">· ${b.version === 'orig' ? 'Original' : b.version}</span><span class="sn">${esc(b.snip)}…</span></button>
      <button class="icon-btn" data-act="bm-del" data-id="${b.id}" aria-label="Remover">${ic('trash')}</button></div>`).join('')
      : '<p class="empty">Nenhum marcador. Use o ícone 🔖 no menu superior.</p>';
  }
  return `<h3>${esc(R.meta.title)}</h3><div class="seg" style="margin:10px 0 6px"><button class="${tab === 'toc' ? 'on' : ''}" data-act="toc-tab" data-t="toc">Sumário</button><button class="${tab === 'bm' ? 'on' : ''}" data-act="toc-tab" data-t="bm">Marcadores</button></div>${body}`;
}
function paraOnPage(pi) {
  if (S.settings.mode !== 'paged') return pi === anchorPara();
  const el = ct().querySelector(`[data-p="${pi}"]`); return !!el && pageOf(el) === R.page;
}
function pageBookmarks() { if (!R.meta) return []; return (S.bookmarks[R.meta.id] || []).filter(b => b.version === R.version && b.ch === R.ch && paraOnPage(b.para)); }
function toggleBookmark() {
  const id = R.meta.id, list = S.bookmarks[id] = S.bookmarks[id] || [], here = pageBookmarks();
  if (here.length) { S.bookmarks[id] = list.filter(b => !here.includes(b)); toast('Marcador removido'); }
  else { const p = anchorPara(); list.unshift({ id: uid(), version: R.version, ch: R.ch, para: p, snip: (R.paras[p]?.t || '').slice(0, 90), t: Date.now() }); toast('Página marcada'); }
  Store.setLazy('bookmarks', S.bookmarks); updateStatus();
}
async function gotoBookmark(bid) {

  else { const a = el.getBoundingClientRect(), b = vp().getBoundingClientRect(); if (a.top < b.top + 40 || a.bottom > b.bottom - 80) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function audioHTML() {
  const vs = Player.engine?.voices() || [], s = S.settings;
  return `<h3>Audiobook</h3>
    <div class="sec"><span class="lbl">Voz em inglês</span>${vs.length ? `<select data-set="voice">${vs.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === s.voice ? 'selected' : ''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}</select>`
      : `<p class="fine">${Player.engine?.supported ? 'Nenhuma voz em inglês encontrada. No iPhone: Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Inglês.' : 'Este navegador não suporta síntese de voz.'}</p>`}</div>
    <div class="sec"><span class="lbl">Velocidade · <span id="rate-v">${(+s.rate).toFixed(2)}×</span></span>
      <input type="range" min="0.6" max="1.25" step="0.05" value="${s.rate}" data-set="rate">
      <div class="chips" style="margin:10px 0 0">${[0.6, 0.75, 0.9, 1, 1.25].map(r => `<button class="btn sm ${+s.rate === r ? 'on' : ''}" data-act="rate" data-v="${r}">${r}×</button>`).join('')}</div>
      <p class="fine">Velocidades menores ajudam iniciantes a acompanhar o texto.</p></div>
    <div class="sec"><span class="lbl">Destaque</span><p class="fine">${Player.boundary ? 'Palavra por palavra (a voz envia os limites de cada palavra).' : 'Por frase. O destaque palavra por palavra é ativado sozinho se a voz suportar o evento boundary.'}</p></div>
    <button class="btn wide" data-act="test-voice">${ic('vol')} Testar voz</button>`;
}

/* =====================================================================
   Navegação de telas e ações
   ===================================================================== */
function showView(v) { S.ui.view = v; $$('.view').forEach(e => e.classList.toggle('active', e.id === v)); if (v === 'library') renderLibrary(); }

const ACT = {
  book: a => openBookSheet(a.dataset.id),
  'sel-level': a => { S.ui.selLevel = S.settings.level = a.dataset.l; saveSettings(); refreshBookSheet(); },
  gen: a => { const id = S.ui.sheetBook, l = a.dataset.l; Queue.add(id, l, new Set(getSel(id, l))); },
  'gen-ch': () => Queue.add(R.meta.id, R.version, new Set([R.ch])),
  'ch-quick': a => {
    const id = S.ui.sheetBook, l = S.ui.selLevel, k = id + ':' + l;
    const set = S.ui.sel[k] = new Set(quickSel(a.dataset.q, S.books[id], S.adapt[k]));
    $$('[data-ch]').forEach(cb => cb.checked = set.has(+cb.dataset.ch));
    updateEstimate();
  },
  pause: () => Queue.pause(),
  resume: () => Queue.resume(),
  read: a => { closeSheet(); openReader(a.dataset.id, a.dataset.v); },
  'del-book': a => { if (confirm('Remover este livro e as versões adaptadas? (Os créditos gastos não voltam.)')) deleteBook(a.dataset.id); },
  'redo-warn': async a => {
    const ad = await getAdapt(S.ui.sheetBook, a.dataset.l); const chs = new Set();
    ad.blocks.forEach(b => { if (b.warn) { chs.add(b.ch); b.out = null; b.warn = ''; } });
    await saveAdapt(ad); Queue.add(ad.bookId, ad.level, chs);
  },
  paste: openPaste,
  'paste-ok': async () => {
    const text = $('#p-text').value.trim(); if (wc(text) < 20) return toast('Cole um texto mais longo.');
    try { const b = parseTxt(text, $('#p-title').value.trim() || 'Texto colado'); if ($('#p-title').value.trim()) b.title = $('#p-title').value.trim(); b.author = $('#p-author').value.trim() || b.author;
      const m = await addBook(b); openBookSheet(m.id); } catch (e) { toast('Erro: ' + e.message); }
  },
  settings: () => openSettings(),
  'save-settings': () => {
    readSettingsForm(); closeSheet();
    toast(API.needsKey() ? 'Salvo (sem chave da API)' : 'Configurações salvas');
    const rb = S.ui.returnBook; S.ui.returnBook = null;
    if (rb && S.ui.view === 'library') setTimeout(() => openBookSheet(rb), 250);
  },
  'test-api': () => testApi(),
  export: () => exportBackup(),
  vocab: openVocab,
  'vocab-back': () => { const pv = S.ui.prevView === 'reader' && R.meta ? 'reader' : 'library'; showView(pv); if (pv === 'reader') relayoutKeep(); },
  vdel: a => { S.vocab = S.vocab.filter(v => v.id !== a.dataset.id); Store.setLazy('vocab', S.vocab, 300); if (a.dataset.close) { closeSheet(); toast('Removida do vocabulário'); } if (S.ui.view === 'vocab') renderVocab(); },
  say: a => Player.sayWord(a.dataset.w),
  close: closeSheet,
  menus: toggleMenus,
  back: closeReader,
  toc: () => openToc(),
  'toc-tab': a => { S.ui.tocTab = a.dataset.t; $('#sheet-body').innerHTML = tocHTML(); },
  'goto-ch': a => { closeSheet(); hideMenus(); renderChapter(+a.dataset.i); },
  'goto-bm': a => gotoBookmark(a.dataset.id),
  'bm-del': a => { S.bookmarks[R.meta.id] = (S.bookmarks[R.meta.id] || []).filter(b => b.id !== a.dataset.id); Store.setLazy('bookmarks', S.bookmarks); $('#sheet-body').innerHTML = tocHTML(); updateStatus(); },
  bm: toggleBookmark,
  aa: () => openSheet(aaHTML(), 'aa'),
  'ww-toggle': () => { S.settings.ww = S.settings.ww ? 0 : 1; WW.failed.clear(); saveSettings(); relayoutKeep(); toast(S.settings.ww ? 'Dicas de palavras ligadas · ajuste em Aa' : 'Dicas de palavras desligadas'); },
  set: a => {
    const k = a.dataset.k, v = a.dataset.v; S.settings[k] = isNaN(+v) ? v : +v;
    if (k === 'ww') WW.failed.clear();
    saveSettings(); applySettings(k !== 'theme'); $('#sheet-body').innerHTML = aaHTML();
  },
  ver: a => setVersion(a.dataset.v),
  'next-ch': () => renderChapter(R.ch + 1),
  play: () => Player.toggle(),
  sprev: () => Player.jump(-1), snext: () => Player.jump(1),
  pprev: () => Player.jumpPara(-1), pnext: () => Player.jumpPara(1),
  audio: () => openSheet(audioHTML(), 'audio'),
  rate: a => { S.settings.rate = +a.dataset.v; saveSettings(); applySettings(false); $('#sheet-body').innerHTML = audioHTML(); Player.restart(); },
  'test-voice': () => Player.sayWord('Hello! This is how I sound when I read your book.'),
};

function bindGlobal() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
    const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); }
  });
  document.addEventListener('change', e => {
    const ci = e.target.dataset?.ch; if (ci == null || !S.ui.sheetBook) return;
    const set = getSel(S.ui.sheetBook, S.ui.selLevel);
    e.target.checked ? set.add(+ci) : set.delete(+ci);
    updateEstimate();
  });
  const relayoutSoon = debounce(relayoutKeep, 160), restartSoon = debounce(() => Player.restart(), 350);
  document.addEventListener('input', e => {
    const k = e.target.dataset?.set; if (!k) return;
    if (k === 'size') { S.settings.size = +e.target.value; $('#sz-v').textContent = S.settings.size + 'px'; applySettings(false); relayoutSoon(); }
    if (k === 'rate') { S.settings.rate = +e.target.value; $('#rate-v').textContent = S.settings.rate.toFixed(2) + '×'; applySettings(false); restartSoon(); }
    if (k === 'voice') { S.settings.voice = e.target.value; restartSoon(); }
    saveSettings();
  });
  document.addEventListener('keydown', e => {
    if (S.ui.view !== 'reader' || /input|textarea|select/i.test(document.activeElement?.tagName || '')) return;
    if (e.key === 'Escape') { S.ui.sheet ? closeSheet() : toggleMenus(); return; }
    if (S.ui.sheet) return;
    if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && S.settings.mode === 'paged')) { e.preventDefault(); nextPage(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prevPage(); }
  });
  // iPhone: o app pode ser fechado a qualquer momento — grava tudo que estiver pendente
  const saveNow = () => { saveProgress(); Store.flush(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('resize', debounce(relayoutKeep, 200));
  $$('[data-ic]').forEach(b => b.innerHTML = ic(b.dataset.ic));
  $$('.mini [data-act=snext]').forEach(b => b.innerHTML = ic('snext'));
}
/* Ícone para a Tela de Início do iPhone */
function setHomeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#2f6f62'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, 0, 18, 180);
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '600 70px Georgia, serif'; x.fillText('Gr', 96, 84);
    x.font = '700 22px -apple-system, Helvetica, sans-serif'; x.fillText('A1–B2', 96, 140);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
}

/* =====================================================================
   Inicialização
   ===================================================================== */
async function init() {
  await Store.init();
  S.settings = { ...DEFAULTS, ...(await Store.get('settings') || {}), apiKey: '' };
  if (S.settings.rememberKey) S.settings.apiKey = await Store.get('apikey') || '';
  S.library = await Store.get('library') || [];
  S.vocab = await Store.get('vocab') || [];
  S.progress = await Store.get('progress') || {};
  S.bookmarks = await Store.get('bookmarks') || {};
  S.wwUsage = await Store.get('wwusage') || { cost: 0 };
  setHomeIcon();
  bindGlobal(); bindReaderInput(); Player.init(); applySettings(false);
  if (!S.library.length && !(await Store.get('seeded'))) {
    for (const b of [...SAMPLES].reverse()) await addBook(JSON.parse(JSON.stringify(b)), { sample: true, silent: true });
    await Store.set('seeded', 1);
  }
  renderLibrary();
}
init();
